name: Update formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.2.0-preview.12. Empty means the newest published release.
        required: false

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Render the formula
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/update_formula.py ${TAG:+"$TAG"}

      - name: Commit a changed formula
        id: commit
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/caudra.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "caudra ${version}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # The runner images ship Homebrew. Updating it would also clean up and upgrade
      # the image's own formulae, which only adds minutes and warnings to this test.
      - name: Install and test from this tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          if ! command -v brew >/dev/null; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew --version
          brew tap caudra/tap "$GITHUB_WORKSPACE"
          brew install caudra/tap/caudra
          brew test caudra/tap/caudra
          brew audit --strict caudra/tap/caudra
